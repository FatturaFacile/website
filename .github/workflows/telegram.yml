name: Telegram Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]

# Best practice SonarQube: nessun token di accesso al codice concesso al workflow
permissions: {}

concurrency:
  group: telegram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    # Dependabot runs get no repository secrets
    if: github.actor != 'dependabot[bot]'
    uses: FatturaFacile/FatturaFacile/.github/workflows/reusable-telegram.yml@main
    secrets: inherit
