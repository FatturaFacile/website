name: Deploy static site to Pages

on:
    push:
        branches: ["main"] # Change to "master" if your primary branch is master

    # Allows you to run this workflow manually from the GitHub Actions tab
    workflow_dispatch:

# Sets permissions required to make a deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
    group: "pages"

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload static artifact from src
              uses: actions/upload-pages-artifact@v5
              with:
                  # Points to the static web files in src
                  path: "./src"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
