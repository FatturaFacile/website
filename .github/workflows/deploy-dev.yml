name: Deploy dev preview

# Every push to dev: i18n parity, typecheck and build, then publish to https://dev-www.fatturafacile.eu
# (static files in ~/fatturafacile-dev/website on the VPS, served by the dev stack of web-api deploy/dev/, not indexed).
# Check the preview there, then merge dev into main to publish fatturafacile.eu (deploy.yml, GitHub Pages).
# The SSH key can only run deploy/server-deploy.sh on the server.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: website-dev-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # Dependabot runs get no secrets
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev-www.fatturafacile.eu
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Verify i18n Keys Parity
        run: npm run test:i18n

      - name: Typecheck Astro & TypeScript
        run: npm run check

      - name: Build Astro SSG
        run: npm run build

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      # The server side (forced command) unpacks the archive and swaps the site contents
      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          tar czf - -C dist . | ssh "$TARGET"
          curl -fsS -o /dev/null https://dev-www.fatturafacile.eu/
