name: Qodana

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Best practice SonarQube: revoca permessi impliciti a livello globale
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    # Dependabot runs get no repository secrets
    if: github.actor != 'dependabot[bot]'
    uses: FatturaFacile/FatturaFacile/.github/workflows/reusable-qodana.yml@main
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    secrets: inherit
